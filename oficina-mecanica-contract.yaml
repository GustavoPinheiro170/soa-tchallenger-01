        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /portal/ordem-servico/orcamento/aprovacao:
    post:
      tags: [Portal do Cliente]
      summary: Cliente aprova o orçamento (inicial ou adicional)
      description: |
        `AGUARDANDO_APROVACAO` → `EM_EXECUCAO`. Baixa as peças reservadas e registra o início da execução.
        Exige a `versao` do orçamento exibido ao cliente — se a oficina alterou o orçamento nesse meio-tempo,
        retorna `409 ORCAMENTO_DESATUALIZADO` (o cliente nunca aprova um valor que não viu).
        O aceite é registrado com data/hora, IP e user-agent (evidência).
      operationId: aprovarOrcamento
      x-use-case: AprovarOrcamentoUseCase
      security:
        - clienteBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisaoOrcamentoRequest' }
      responses:
        '200':
          description: Orçamento aprovado
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcompanhamentoOSResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /portal/ordem-servico/orcamento/recusa:
    post:
      tags: [Portal do Cliente]
      summary: Cliente recusa o orçamento
      description: |
        Orçamento **inicial** recusado → OS `FINALIZADA` sem execução e reservas liberadas.
        Orçamento **adicional** recusado → itens adicionais descartados e OS volta a `EM_EXECUCAO`.
      operationId: recusarOrcamento
      x-use-case: RecusarOrcamentoUseCase
      security:
        - clienteBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisaoOrcamentoRequest' }
      responses:
        '200':
          description: Orçamento recusado
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcompanhamentoOSResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ═════════════════════════ MÉTRICAS ═════════════════════════
  /metricas/tempo-medio-execucao:
    get:
      tags: [Métricas]
      summary: Tempo médio de execução dos serviços
      description: |
        Calculado sobre OS `FINALIZADA`/`ENTREGUE` no período (máx. 366 dias):
        execução (`EM_EXECUCAO` → `FINALIZADA`), aprovação (`AGUARDANDO_APROVACAO` → `EM_EXECUCAO`)
        e ciclo total (`RECEBIDA` → `ENTREGUE`), com detalhamento por serviço.
      operationId: obterTempoMedioExecucao
      x-use-case: CalcularTempoMedioExecucaoUseCase
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: dataInicio
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dataFim
          in: query
          required: true
          schema: { type: string, format: date }
        - name: servicoId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Métricas
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricaTempoExecucaoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

# ═══════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token de **usuário interno** emitido em `POST /auth/login`.
        Assinatura assimétrica **RS256** (chave privada fora do repositório, via variável de ambiente/secret),
        validade de 15 min. Claims: `sub` (id do usuário), `roles`, `iss`, `aud=oficina-api`, `iat`, `exp`, `jti`.
        `iss`, `aud`, `exp` e o algoritmo são sempre validados (`alg=none` rejeitado).
        O perfil exigido por operação está em `x-roles`.
    clienteBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token do **cliente** emitido em `POST /portal/autenticacao/{desafioId}/verificacao`.
        `aud=oficina-portal`, `scope=portal:os`, `sub` = id da OS, validade de 30 min.
        Não é aceito nas rotas administrativas (e vice-versa).

  headers:
    XRequestId:
      description: Identificador de correlação da requisição (ecoado ou gerado)
      schema: { type: string, format: uuid }
    Location:
      description: URI do recurso criado
      schema: { type: string, format: uri-reference, maxLength: 255 }
    ETag:
      description: Versão do recurso (usar em `If-Match` para concorrência otimista)
      schema: { type: string, maxLength: 64, example: 'W/"3"' }
    CacheControlNoStore:
      description: Respostas com dados sensíveis não podem ser armazenadas em cache
      schema: { type: string, enum: [no-store] }
    RetryAfter:
      description: Segundos até poder tentar novamente
      schema: { type: integer, minimum: 1 }
    RateLimitLimit:
      description: Máximo de requisições na janela
      schema: { type: integer }
    RateLimitRemaining:
      description: Requisições restantes na janela
      schema: { type: integer }
    RateLimitReset:
      description: Segundos até a janela reiniciar
      schema: { type: integer }

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Id de correlação (UUID). Gerado pelo servidor se ausente.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID gerado pelo cliente. Reenvios com a mesma chave (por 24 h) retornam a resposta original
        sem reexecutar o caso de uso. Mesma chave com corpo diferente → `422 IDEMPOTENCIA_CONFLITANTE`.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag obtido no último `GET` do recurso (concorrência otimista).
      schema: { type: string, maxLength: 64 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ClienteId:
      name: clienteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VeiculoId:
      name: veiculoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServicoId:
      name: servicoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PecaId:
      name: pecaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OsId:
      name: osId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    OrdemServicoAtualizada:
      description: Comando executado; OS com novo status
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrdemServicoResponse' }
    BadRequest:
      description: Requisição malformada ou campos inválidos
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.oficina.example.com/problems/validacao
            title: Dados inválidos
            status: 400
            codigo: VALIDACAO
            detail: Um ou mais campos são inválidos
            traceId: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
            erros:
              - { campo: documento, mensagem: CPF/CNPJ inválido }
              - { campo: placa, mensagem: 'Placa deve seguir o padrão ABC1234 ou ABC1D23' }
    Unauthorized:
      description: Não autenticado — token ausente, inválido, expirado ou revogado / credenciais inválidas
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        WWW-Authenticate:
          schema: { type: string, example: 'Bearer error="invalid_token"' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.oficina.example.com/problems/nao-autenticado
            title: Não autenticado
            status: 401
            codigo: NAO_AUTENTICADO
            traceId: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
    Forbidden:
      description: Autenticado, mas o perfil/escopo não permite esta operação
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.oficina.example.com/problems/acesso-negado
            title: Acesso negado
            status: 403
            codigo: ACESSO_NEGADO
            traceId: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
    NotFound:
      description: Recurso não encontrado (também usado quando o recurso existe mas o chamador não pode vê-lo)
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflito com o estado atual (duplicidade, transição inválida, orçamento desatualizado)
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.oficina.example.com/problems/os-transicao-invalida
            title: Transição de status inválida
            status: 409
            codigo: OS_TRANSICAO_INVALIDA
            detail: Não é possível finalizar uma OS em AGUARDANDO_APROVACAO
            traceId: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
    PreconditionFailed:
      description: '`If-Match` não corresponde à versão atual (recurso alterado por outro usuário)'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: Cabeçalho `If-Match` obrigatório não informado
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Content-Type diferente de `application/json`
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: Regra de negócio violada
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.oficina.example.com/problems/estoque-insuficiente
            title: Estoque insuficiente
            status: 422
            codigo: ESTOQUE_INSUFICIENTE
            detail: 'Disponível: 2; solicitado: 4'
            traceId: 1b4e28ba-2fa1-11d2-883f-0016d3cca427
    TooManyRequests:
      description: Limite de requisições excedido
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Erro inesperado. Nunca expõe stack trace, SQL ou detalhes de infraestrutura — apenas o `traceId`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: about:blank
            title: Erro interno
            status: 500
            codigo: ERRO_INTERNO
            traceId: 1b4e28ba-2fa1-11d2-883f-0016d3cca427

  schemas:
    # ─────────────── Value Objects (Domain) ───────────────
    Documento:
      type: string
      description: 'Value Object: CPF (11) ou CNPJ (14 dígitos), somente números, validado por dígitos verificadores.'
      pattern: '^(\d{11}|\d{14})$'
      minLength: 11
      maxLength: 14
      example: '52998224725'
    DocumentoMascarado:
      type: string
      maxLength: 20
      example: '***.982.247-**'
    Placa:
      type: string
      description: 'Value Object: padrão antigo (ABC1234) ou Mercosul (ABC1D23), maiúsculas, sem hífen.'
      pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$'
      minLength: 7
      maxLength: 7
      example: ABC1D23
    Dinheiro:
      type: string
      description: 'Value Object: valor em BRL como decimal com 2 casas (evita erro de ponto flutuante).'
      pattern: '^\d{1,9}\.\d{2}$'
      maxLength: 12
      example: '149.90'
    Quantidade:
      type: number
      description: 'Value Object: quantidade positiva (até 3 casas decimais para insumos a granel).'
      minimum: 0.001
      maximum: 100000
      multipleOf: 0.001
      example: 4
    Email:
      type: string
      format: email
      maxLength: 254
    Telefone:
      type: string
      description: Formato E.164
      pattern: '^\+?[1-9]\d{9,14}$'
      maxLength: 16
    TextoCurto:
      type: string
      maxLength: 150
      pattern: '^[^<>]*$'
    TextoLivre:
      type: string
      maxLength: 1000
      description: Texto livre; armazenado como texto puro e sempre escapado na saída (anti-XSS).

    # ─────────────── Enums de domínio ───────────────
    StatusOS:
      type: string
      enum: [RECEBIDA, EM_DIAGNOSTICO, AGUARDANDO_APROVACAO, EM_EXECUCAO, FINALIZADA, ENTREGUE]
    StatusOrcamento:
      type: string
      enum: [RASCUNHO, ENVIADO, APROVADO, RECUSADO]
    Perfil:
      type: string
      enum: [ADMIN, ATENDENTE, MECANICO]
    TipoDocumento:
      type: string
      enum: [CPF, CNPJ]
    TipoItemEstoque:
      type: string
      enum: [PECA, INSUMO]
    UnidadeMedida:
      type: string
      enum: [UNIDADE, LITRO, KG, METRO, KIT]
    TipoMovimentacao:
      type: string
      enum: [ENTRADA, SAIDA, AJUSTE_INVENTARIO, RESERVA, LIBERACAO_RESERVA, BAIXA_OS]
    CodigoErro:
      type: string
      description: Código estável de erro (contrato para o front-end; independente da mensagem).
      enum:
        - VALIDACAO
        - NAO_AUTENTICADO
        - ACESSO_NEGADO
        - RECURSO_NAO_ENCONTRADO
        - DOCUMENTO_INVALIDO
        - DOCUMENTO_JA_CADASTRADO
        - PLACA_INVALIDA
        - PLACA_JA_CADASTRADA
        - CLIENTE_COM_OS_ABERTA
        - VEICULO_COM_OS_ABERTA
        - VEICULO_NAO_PERTENCE_AO_CLIENTE
        - SERVICO_INATIVO
        - PECA_INATIVA
        - PECA_COM_RESERVA
        - CODIGO_PECA_DUPLICADO
        - ESTOQUE_INSUFICIENTE
        - OS_TRANSICAO_INVALIDA
        - OS_ITEM_NAO_EDITAVEL
        - ORCAMENTO_SEM_ITENS
        - ORCAMENTO_DESATUALIZADO
        - VERSAO_DESATUALIZADA
        - IF_MATCH_OBRIGATORIO
        - IDEMPOTENCIA_CONFLITANTE
        - LIMITE_REQUISICOES
        - ERRO_INTERNO

    # ─────────────── Identidade & Acesso ───────────────
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, senha]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        senha:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 128
          description: Armazenada com hash **Argon2id/BCrypt**; nunca registrada em log.
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 32, maxLength: 512, writeOnly: true }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshToken, refreshExpiresIn]
      properties:
        accessToken: { type: string, maxLength: 4096 }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, example: 900 }
        refreshToken: { type: string, maxLength: 512 }
        refreshExpiresIn: { type: integer, example: 604800 }
    UsuarioResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, maxLength: 150 }
        email: { $ref: '#/components/schemas/Email' }
        perfis:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Perfil' }

    # ─────────────── Clientes ───────────────
    ClienteRequest:
      type: object
      additionalProperties: false
      required: [documento, nome, email]
      properties:
        documento: { $ref: '#/components/schemas/Documento' }
        nome: { $ref: '#/components/schemas/TextoCurto' }
        email: { $ref: '#/components/schemas/Email' }
        telefone: { $ref: '#/components/schemas/Telefone' }
        endereco: { $ref: '#/components/schemas/EnderecoDTO' }
    AtualizarClienteRequest:
      type: object
      additionalProperties: false
      required: [nome, email]
      properties:
        nome: { $ref: '#/components/schemas/TextoCurto' }
        email: { $ref: '#/components/schemas/Email' }
        telefone: { $ref: '#/components/schemas/Telefone' }
        endereco: { $ref: '#/components/schemas/EnderecoDTO' }
    PesquisaClienteRequest:
      type: object
      additionalProperties: false
      required: [documento]
      properties:
        documento: { $ref: '#/components/schemas/Documento' }
    ClienteResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipoDocumento: { $ref: '#/components/schemas/TipoDocumento' }
        documento: { $ref: '#/components/schemas/Documento' }
        nome: { type: string, maxLength: 150 }
        email: { $ref: '#/components/schemas/Email' }
        telefone: { $ref: '#/components/schemas/Telefone' }
        endereco: { $ref: '#/components/schemas/EnderecoDTO' }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    ClienteResumoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string, maxLength: 150 }
        documentoMascarado: { $ref: '#/components/schemas/DocumentoMascarado' }
    EnderecoDTO:
      type: object
      additionalProperties: false
      properties:
        logradouro: { type: string, maxLength: 150 }
        numero: { type: string, maxLength: 10 }
        complemento: { type: string, maxLength: 60 }
        bairro: { type: string, maxLength: 80 }
        cidade: { type: string, maxLength: 80 }
        uf: { type: string, pattern: '^[A-Z]{2}$' }
        cep: { type: string, pattern: '^\d{8}$' }

    # ─────────────── Veículos ───────────────
    VeiculoRequest:
      type: object
      additionalProperties: false
      required: [placa, marca, modelo, ano, clienteId]
      properties:
        placa: { $ref: '#/components/schemas/Placa' }
        marca: { type: string, minLength: 2, maxLength: 60, example: Volkswagen }
        modelo: { type: string, minLength: 1, maxLength: 80, example: Gol 1.6 }
        ano: { type: integer, minimum: 1950, maximum: 2100, example: 2019, description: 'Não pode ser maior que ano atual + 1' }
        cor: { type: string, maxLength: 30 }
        clienteId: { type: string, format: uuid }
    NovoVeiculoRequest:
      type: object
      additionalProperties: false
      required: [placa, marca, modelo, ano]
      properties:
        placa: { $ref: '#/components/schemas/Placa' }
        marca: { type: string, minLength: 2, maxLength: 60 }
        modelo: { type: string, minLength: 1, maxLength: 80 }
        ano: { type: integer, minimum: 1950, maximum: 2100 }
        cor: { type: string, maxLength: 30 }
    VeiculoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        placa: { $ref: '#/components/schemas/Placa' }
        marca: { type: string }
        modelo: { type: string }
        ano: { type: integer }
        cor: { type: string }
        clienteId: { type: string, format: uuid }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }
    VeiculoResumoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        placa: { $ref: '#/components/schemas/Placa' }
        marca: { type: string }
        modelo: { type: string }
        ano: { type: integer }

    # ─────────────── Serviços ───────────────
    ServicoRequest:
      type: object
      additionalProperties: false
      required: [nome, preco, tempoEstimadoMinutos]
      properties:
        nome: { type: string, minLength: 2, maxLength: 120, example: Troca de óleo }
        descricao: { type: string, maxLength: 500 }
        preco: { $ref: '#/components/schemas/Dinheiro' }
        tempoEstimadoMinutos: { type: integer, minimum: 1, maximum: 10080, example: 45 }
        ativo: { type: boolean, default: true }
    ServicoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        descricao: { type: string }
        preco: { $ref: '#/components/schemas/Dinheiro' }
        tempoEstimadoMinutos: { type: integer }
        ativo: { type: boolean }
        criadoEm: { type: string, format: date-time }
        atualizadoEm: { type: string, format: date-time }

    # ─────────────── Estoque ───────────────
    PecaRequest:
      type: object
      additionalProperties: false
      required: [codigo, nome, tipo, unidade, precoVenda, estoqueMinimo]
      properties:
        codigo: { type: string, pattern: '^[A-Z0-9-]{3,30}$', description: SKU interno único, example: FLT-OLEO-001 }
        nome: { type: string, minLength: 2, maxLength: 120, example: Filtro de óleo }
        descricao: { type: string, maxLength: 500 }
        tipo: { $ref: '#/components/schemas/TipoItemEstoque' }
        unidade: { $ref: '#/components/schemas/UnidadeMedida' }
        fabricante: { type: string, maxLength: 80 }
        precoCusto: { $ref: '#/components/schemas/Dinheiro' }
        precoVenda: { $ref: '#/components/schemas/Dinheiro' }
        estoqueMinimo: { type: number, minimum: 0, maximum: 100000 }
    PecaResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        nome: { type: string }
        descricao: { type: string }
        tipo: { $ref: '#/components/schemas/TipoItemEstoque' }
        unidade: { $ref: '#/components/schemas/UnidadeMedida' }
        fabricante: { type: string }
        precoCusto:
          allOf: [{ $ref: '#/components/schemas/Dinheiro' }]
          nullable: true
          description: Omitido (null) para perfis diferentes de ADMIN.
        precoVenda: { $ref: '#/components/schemas/Dinheiro' }
        estoqueMinimo: { type: number }
        saldoFisico: { type: number, description: Quantidade física em estoque }
        saldoReservado: { type: number, description: Reservado para OS ainda não aprovadas }
        saldoDisponivel: { type: number, description: físico − reservado }
        abaixoDoMinimo: { type: boolean }
        ativo: { type: boolean }
        atualizadoEm: { type: string, format: date-time }
    MovimentacaoEstoqueRequest:
      type: object
      additionalProperties: false
      required: [tipo, quantidade]
      properties:
        tipo: { type: string, enum: [ENTRADA, SAIDA, AJUSTE_INVENTARIO] }
        quantidade: { $ref: '#/components/schemas/Quantidade' }
        motivo: { type: string, maxLength: 255, description: Obrigatório para AJUSTE_INVENTARIO e SAIDA }
        custoUnitario: { $ref: '#/components/schemas/Dinheiro' }
        documentoFiscal: { type: string, maxLength: 60, example: NF 12345 }
    MovimentacaoEstoqueResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        pecaId: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoMovimentacao' }
        quantidade: { type: number }
        saldoFisicoApos: { type: number }
        motivo: { type: string }
        ordemServicoId: { type: string, format: uuid, nullable: true }
        realizadoPor: { type: string, format: uuid, description: Id do usuário (auditoria) }
        realizadoEm: { type: string, format: date-time }

    # ─────────────── Ordem de Serviço (agregado) ───────────────
    ItemServicoRequest:
      type: object
      additionalProperties: false
      required: [servicoId]
      properties:
        servicoId: { type: string, format: uuid }
        quantidade: { type: integer, minimum: 1, maximum: 50, default: 1 }
        observacao: { type: string, maxLength: 255 }
    ItemPecaRequest:
      type: object
      additionalProperties: false
      required: [pecaId, quantidade]
      properties:
        pecaId: { type: string, format: uuid }
        quantidade: { $ref: '#/components/schemas/Quantidade' }
    NovoClienteRequest:
      type: object
      additionalProperties: false
      required: [nome, email]
      properties:
        nome: { $ref: '#/components/schemas/TextoCurto' }
        email: { $ref: '#/components/schemas/Email' }
        telefone: { $ref: '#/components/schemas/Telefone' }
    AbrirOrdemServicoRequest:
      type: object
      additionalProperties: false
      required: [documentoCliente, servicos]
      description: Informe exatamente um entre `veiculoId` e `novoVeiculo`.
      properties:
        documentoCliente: { $ref: '#/components/schemas/Documento' }
        novoCliente: { $ref: '#/components/schemas/NovoClienteRequest' }
        veiculoId: { type: string, format: uuid }
        novoVeiculo: { $ref: '#/components/schemas/NovoVeiculoRequest' }
        servicos:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/ItemServicoRequest' }
        pecas:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ItemPecaRequest' }
        relatoCliente: { $ref: '#/components/schemas/TextoLivre' }
    ObservacaoRequest:
      type: object
      additionalProperties: false
      properties:
        observacao: { $ref: '#/components/schemas/TextoLivre' }
    ItemServicoOSResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        servicoId: { type: string, format: uuid }
        nome: { type: string }
        quantidade: { type: integer }
        precoUnitario: { $ref: '#/components/schemas/Dinheiro' }
        subtotal: { $ref: '#/components/schemas/Dinheiro' }
        adicional: { type: boolean, description: Incluído após a aprovação inicial }
    ItemPecaOSResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        pecaId: { type: string, format: uuid }
        nome: { type: string }
        quantidade: { type: number }
        precoUnitario: { $ref: '#/components/schemas/Dinheiro' }
        subtotal: { $ref: '#/components/schemas/Dinheiro' }
        adicional: { type: boolean }
    OrcamentoResponse:
      type: object
      properties:
        versao: { type: integer, minimum: 1, description: Incrementa a cada alteração/orçamento adicional }
        status: { $ref: '#/components/schemas/StatusOrcamento' }
        totalServicos: { $ref: '#/components/schemas/Dinheiro' }
        totalPecas: { $ref: '#/components/schemas/Dinheiro' }
        valorTotal: { $ref: '#/components/schemas/Dinheiro' }
        tempoEstimadoMinutos: { type: integer }
        geradoEm: { type: string, format: date-time }
        enviadoEm: { type: string, format: date-time, nullable: true }
        decididoEm: { type: string, format: date-time, nullable: true }
    HistoricoStatusResponse:
      type: object
      properties:
        statusAnterior:
          allOf: [{ $ref: '#/components/schemas/StatusOS' }]
          nullable: true
        statusNovo: { $ref: '#/components/schemas/StatusOS' }
        ocorridoEm: { type: string, format: date-time }
        origem: { type: string, enum: [USUARIO, CLIENTE, SISTEMA] }
        usuarioId: { type: string, format: uuid, nullable: true }
        observacao: { type: string }
    OrdemServicoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        numero: { type: string, example: '2026-000123', description: Número legível (não usado como identificador de API) }
        status: { $ref: '#/components/schemas/StatusOS' }
        cliente: { $ref: '#/components/schemas/ClienteResumoResponse' }
        veiculo: { $ref: '#/components/schemas/VeiculoResumoResponse' }
        servicos:
          type: array
          items: { $ref: '#/components/schemas/ItemServicoOSResponse' }
        pecas:
          type: array
          items: { $ref: '#/components/schemas/ItemPecaOSResponse' }
        orcamento: { $ref: '#/components/schemas/OrcamentoResponse' }
        relatoCliente: { type: string }
        abertaEm: { type: string, format: date-time }
        inicioExecucaoEm: { type: string, format: date-time, nullable: true }
        finalizadaEm: { type: string, format: date-time, nullable: true }
        entregueEm: { type: string, format: date-time, nullable: true }
        acoesPermitidas:
          type: array
          description: Comandos válidos no status atual (derivado do agregado — o front não replica regra de negócio).
          items:
            type: string
            enum: [INCLUIR_ITEM, REMOVER_ITEM, INICIAR_DIAGNOSTICO, ENVIAR_ORCAMENTO, FINALIZAR, ENTREGAR]
    OrdemServicoResumoResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        status: { $ref: '#/components/schemas/StatusOS' }
        clienteNome: { type: string }
        placa: { $ref: '#/components/schemas/Placa' }
        valorTotal: { $ref: '#/components/schemas/Dinheiro' }
        abertaEm: { type: string, format: date-time }

    # ─────────────── Portal do Cliente ───────────────
    SolicitarAcessoRequest:
      type: object
      additionalProperties: false
      required: [codigoAcompanhamento, documento]
      properties:
        codigoAcompanhamento:
          type: string
          pattern: '^OS-[A-HJ-NP-Z2-9]{10}$'
          description: Código aleatório (≈ 50 bits de entropia) enviado ao cliente na abertura da OS.
          example: OS-7K2M9QXAHT
        documento: { $ref: '#/components/schemas/Documento' }
    DesafioAcessoResponse:
      type: object
      properties:
        desafioId: { type: string, format: uuid }
        expiraEm: { type: string, format: date-time }
        mensagem:
          type: string
          example: Se os dados estiverem corretos, você receberá um código no contato cadastrado.
    VerificarAcessoRequest:
      type: object
      additionalProperties: false
      required: [codigo]
      properties:
        codigo: { type: string, pattern: '^\d{6}$', writeOnly: true }
    TokenClienteResponse:
      type: object
      properties:
        accessToken: { type: string, maxLength: 4096 }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, example: 1800 }
    DecisaoOrcamentoRequest:
      type: object
      additionalProperties: false
      required: [versaoOrcamento]
      properties:
        versaoOrcamento:
          type: integer
          minimum: 1
          description: Versão do orçamento exibida ao cliente (garante que ele decide sobre o valor que viu).
        comentario: { type: string, maxLength: 500 }
    AcompanhamentoOSResponse:
      type: object
      description: Visão do cliente — sem custos internos, sem ids de usuários, dados pessoais mascarados.
      properties:
        numero: { type: string }
        status: { $ref: '#/components/schemas/StatusOS' }
        descricaoStatus: { type: string, example: Seu veículo está em execução }
        clienteNome: { type: string }
        documentoMascarado: { $ref: '#/components/schemas/DocumentoMascarado' }
        veiculo:
          type: object
          properties:
            placaMascarada: { type: string, example: ABC-**23 }
            marca: { type: string }
            modelo: { type: string }
        orcamento:
          type: object
          properties:
            versao: { type: integer }
            status: { $ref: '#/components/schemas/StatusOrcamento' }
            valorTotal: { $ref: '#/components/schemas/Dinheiro' }
            itens:
              type: array
              items:
                type: object
                properties:
                  descricao: { type: string }
                  tipo: { type: string, enum: [SERVICO, PECA] }
                  quantidade: { type: number }
                  subtotal: { $ref: '#/components/schemas/Dinheiro' }
                  adicional: { type: boolean }
        aguardandoAprovacao: { type: boolean }
        linhaDoTempo:
          type: array
          items:
            type: object
            properties:
              status: { $ref: '#/components/schemas/StatusOS' }
              ocorridoEm: { type: string, format: date-time }
        previsaoConclusao: { type: string, format: date-time, nullable: true }

    # ─────────────── Métricas ───────────────
    MetricaTempoExecucaoResponse:
      type: object
      properties:
        periodoInicio: { type: string, format: date }
        periodoFim: { type: string, format: date }
        totalOrdensConsideradas: { type: integer, example: 42 }
        tempoMedioExecucaoMinutos: { type: number, example: 135.5 }
        tempoMedioAprovacaoMinutos: { type: number, example: 240.0 }
        tempoMedioCicloTotalMinutos: { type: number, example: 1720.0 }
        porServico:
          type: array
          items:
            type: object
            properties:
              servicoId: { type: string, format: uuid }
              nome: { type: string }
              quantidadeOS: { type: integer }
              tempoEstimadoMinutos: { type: integer }
              tempoMedioRealMinutos: { type: number }
              desvioPercentual: { type: number, description: '(real − estimado) / estimado × 100' }

    # ─────────────── Paginação ───────────────
    PaginaMeta:
      type: object
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }
    PaginaClientes:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - type: object
          properties:
            content: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ClienteResponse' } }
    PaginaVeiculos:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - type: object
          properties:
            content: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/VeiculoResponse' } }
    PaginaServicos:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - type: object
          properties:
            content: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ServicoResponse' } }
    PaginaPecas:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - type: object
          properties:
            content: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/PecaResponse' } }
    PaginaMovimentacoes:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - type: object
          properties:
            content: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/MovimentacaoEstoqueResponse' } }
    PaginaOrdensServicoResumo:
      allOf:
        - $ref: '#/components/schemas/PaginaMeta'
        - type: object
          properties:
            content: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/OrdemServicoResumoResponse' } }

    # ─────────────── Erro (RFC 9457) ───────────────
    Problem:
      type: object
      required: [type, title, status, codigo, traceId]
      properties:
        type: { type: string, format: uri-reference, maxLength: 255 }
        title: { type: string, maxLength: 150 }
        status: { type: integer, minimum: 400, maximum: 599 }
        codigo: { $ref: '#/components/schemas/CodigoErro' }
        detail: { type: string, maxLength: 500 }
        instance: { type: string, maxLength: 255 }
        traceId: { type: string, format: uuid, description: Mesmo valor de X-Request-Id — use-o para localizar o log }
        timestamp: { type: string, format: date-time }
        erros:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              campo: { type: string, maxLength: 100 }
              mensagem: { type: string, maxLength: 255 }
