openapi: 3.0.3
info:
  title: Oficina Mecânica — Sistema Integrado de Atendimento e Execução de Serviços (MVP)
  version: 2.0.0
  description: |
    API RESTful do back-end monolítico da oficina mecânica, construída com **DDD** e **Clean Architecture**
    e seguindo o **OWASP API Security Top 10 (2023)**.

    ---
    ## 1. Clean Architecture — como este contrato se encaixa

    ```
    ┌──────────────────────────────────────────────────────────────────────┐
    │ Frameworks & Drivers  →  HTTP (este contrato), Banco de dados, E-mail  │
    │ Interface Adapters    →  Controllers, Presenters, DTOs (Request/Resp.) │
    │ Application           →  Use Cases (1 operação = 1 caso de uso)        │
    │ Domain                →  Entidades, Value Objects, Agregados, Eventos  │
    └──────────────────────────────────────────────────────────────────────┘
               Dependências apontam sempre para dentro (Domain não conhece HTTP)
    ```

    Convenções aplicadas no contrato:
    - **Uma operação = um caso de uso.** A extensão `x-use-case` indica a classe da camada Application
      (ex.: `AbrirOrdemServicoUseCase`). O controller só converte DTO ⇄ comando e delega.
    - **DTOs de entrada e saída separados** (`*Request` / `*Response`). O modelo de domínio e as
      entidades de persistência nunca são expostos diretamente.
    - **Transições de estado são comandos explícitos** (`POST /ordens-servico/{id}/diagnostico`, `/finalizacao` …),
      nunca um `PATCH status` genérico. A regra de transição vive no agregado `OrdemServico`.
    - **Value Objects** do domínio aparecem como schemas reutilizáveis: `Documento` (CPF/CNPJ), `Placa`, `Dinheiro`, `Quantidade`.
    - **Bounded contexts** viram tags: Identidade & Acesso, Cadastro, Catálogo, Estoque, Atendimento (OS),
      Portal do Cliente e Métricas.
    - **Erros de domínio** são mapeados para HTTP em um único ponto (exception handler), no formato
      RFC 9457 (`application/problem+json`) com `codigo` estável (ver `CodigoErro`).
    - Valores monetários trafegam como **string decimal** (sem ponto flutuante).

    ---
    ## 2. Segurança (OWASP API Top 10)

    | Risco | Mitigação neste contrato |
    |---|---|
    | API1 — BOLA | IDs UUID v4 (não sequenciais); o Portal do Cliente não recebe ID de OS: a OS vem do **token** do cliente. |
    | API2 — Broken Authentication | JWT de acesso curto (**15 min**) + refresh token rotativo com detecção de reuso; logout revoga; login com limite de tentativas e mensagem genérica; cliente autentica por **OTP**, não por CPF. |
    | API3 — Broken Object Property Level Auth. | `additionalProperties: false` em todos os requests (evita *mass assignment*); campos `readOnly`; respostas do cliente com dados mascarados. |
    | API4 — Unrestricted Resource Consumption | `maxLength`/`maxItems`/`maximum` em todos os campos; paginação limitada a 100; rate limiting com cabeçalhos `RateLimit-*` e `Retry-After`. |
    | API5 — Broken Function Level Auth. | RBAC por operação (`x-roles`): `ADMIN`, `ATENDENTE`, `MECANICO`; `403` quando o perfil não permite. |
    | API6 — Fluxos de negócio sensíveis | `Idempotency-Key` obrigatório em comandos (abrir OS, aprovar orçamento, mover estoque). |
    | API7 — SSRF | Nenhum endpoint aceita URL fornecida pelo usuário. |
    | API8 — Security Misconfiguration | HTTPS obrigatório fora do ambiente local; cabeçalhos `Strict-Transport-Security`, `X-Content-Type-Options: nosniff`, `Cache-Control: no-store` em respostas autenticadas; CORS restrito; erros sem *stack trace*. |
    | API9 — Improper Inventory Management | Versionamento na URL (`/api/v1`); operações obsoletas marcadas com `deprecated`. |
    | API10 — Unsafe Consumption of APIs | Não há consumo de APIs de terceiros no MVP (envio de e-mail/SMS via adaptador isolado). |

    **Dados pessoais (LGPD):** CPF/CNPJ nunca aparece em URL (path ou query), pois URLs são registradas em logs e proxies.
    Buscas por documento usam `POST /clientes/pesquisa`. Logs mascaram CPF/CNPJ e tokens.

    **Concorrência otimista:** `GET` de recursos mutáveis devolve `ETag`; `PUT`/`DELETE` exigem `If-Match`
    (`428` se ausente, `412` se desatualizado).

    **Rastreabilidade:** todo request pode enviar `X-Request-Id` (UUID); a resposta sempre devolve o mesmo valor
    (ou um gerado), também presente em `Problem.traceId`. Ações administrativas geram trilha de auditoria.

    ---
    ## 3. Ciclo de vida da OS

    | Comando | Perfil | Transição |
    |---|---|---|
    | `POST /ordens-servico` | ATENDENTE | → `RECEBIDA` |
    | `POST /ordens-servico/{id}/diagnostico` | MECANICO | `RECEBIDA` → `EM_DIAGNOSTICO` |
    | `POST /ordens-servico/{id}/orcamento/envio` | ATENDENTE | `EM_DIAGNOSTICO` → `AGUARDANDO_APROVACAO` |
    | `POST /portal/ordem-servico/orcamento/aprovacao` | Cliente | `AGUARDANDO_APROVACAO` → `EM_EXECUCAO` |
    | `POST /portal/ordem-servico/orcamento/recusa` | Cliente | orçamento inicial → `FINALIZADA`; adicional → `EM_EXECUCAO` |
    | Inclusão de item em `EM_EXECUCAO` | MECANICO | `EM_EXECUCAO` → `AGUARDANDO_APROVACAO` (orçamento adicional) |
    | `POST /ordens-servico/{id}/finalizacao` | MECANICO | `EM_EXECUCAO` → `FINALIZADA` |
    | `POST /ordens-servico/{id}/entrega` | ATENDENTE | `FINALIZADA` → `ENTREGUE` |

    Transição inválida → `409` com `codigo = OS_TRANSICAO_INVALIDA`.
  contact:
    name: Grupo SOAT — Fase 1
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.oficina.example.com/api/v1
    description: Produção (somente HTTPS / TLS 1.2+)
  - url: http://localhost:8080/api/v1
    description: Ambiente local (docker-compose) — HTTP permitido apenas aqui

tags:
  - name: Identidade & Acesso
    description: Autenticação de usuários internos (JWT + refresh token rotativo).
  - name: Cadastro — Clientes
    description: Gestão de clientes (dados pessoais protegidos pela LGPD).
  - name: Cadastro — Veículos
    description: Gestão de veículos vinculados a clientes.
  - name: Catálogo — Serviços
    description: Catálogo de serviços oferecidos pela oficina.
  - name: Estoque — Peças e Insumos
    description: Cadastro de peças/insumos e movimentações de estoque.
  - name: Atendimento — Ordens de Serviço
    description: Agregado OrdemServico — abertura, itens, orçamento e ciclo de vida.
  - name: Portal do Cliente
    description: Autenticação do cliente por OTP, acompanhamento da OS e aprovação de orçamento.
  - name: Métricas
    description: Indicadores operacionais (tempo médio de execução).

security:
  - bearerAuth: []

paths:
  # ═════════════════════════ IDENTIDADE & ACESSO ═════════════════════════
  /auth/login:
    post:
      tags: [Identidade & Acesso]
      summary: Autentica usuário interno
      description: |
        Retorna um access token (JWT, 15 min) e um refresh token opaco (7 dias, uso único).
        Credenciais inválidas sempre retornam a **mesma** mensagem genérica, sem indicar se o e-mail existe.
        Após 5 falhas consecutivas a conta é bloqueada temporariamente (15 min) e o IP sofre rate limit.
      operationId: autenticarUsuario
      x-use-case: AutenticarUsuarioUseCase
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Autenticado
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [Identidade & Acesso]
      summary: Renova o access token (rotação de refresh token)
      description: |
        O refresh token informado é invalidado e um novo par é emitido. A reutilização de um refresh token
        já usado revoga **toda a família** de tokens da sessão (detecção de roubo).
      operationId: renovarToken
      x-use-case: RenovarTokenUseCase
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '200':
          description: Novo par de tokens
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      tags: [Identidade & Acesso]
      summary: Encerra a sessão
      description: Revoga o refresh token e adiciona o `jti` do access token à denylist até sua expiração.
      operationId: encerrarSessao
      x-use-case: EncerrarSessaoUseCase
      x-roles: [ADMIN, ATENDENTE, MECANICO]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshTokenRequest' }
      responses:
        '204':
          description: Sessão encerrada
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/me:
    get:
      tags: [Identidade & Acesso]
      summary: Dados do usuário autenticado
      operationId: obterUsuarioAutenticado
      x-use-case: ObterUsuarioAutenticadoUseCase
      x-roles: [ADMIN, ATENDENTE, MECANICO]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Usuário autenticado
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ═════════════════════════ CLIENTES ═════════════════════════
  /clientes:
    get:
      tags: [Cadastro — Clientes]
      summary: Lista clientes
      description: Para localizar por CPF/CNPJ use `POST /clientes/pesquisa` (o documento não trafega em URL).
      operationId: listarClientes
      x-use-case: ListarClientesUseCase
      x-roles: [ADMIN, ATENDENTE]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          schema: { type: string, enum: [nome, -nome, criadoEm, -criadoEm], default: nome }
        - name: nome
          in: query
          description: Filtro parcial por nome
          schema: { type: string, minLength: 2, maxLength: 150 }
      responses:
        '200':
          description: Página de clientes
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaClientes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Cadastro — Clientes]
      summary: Cadastra cliente
      description: CPF/CNPJ validado pelos dígitos verificadores (Value Object `Documento`) e único no sistema.
      operationId: cadastrarCliente
      x-use-case: CadastrarClienteUseCase
      x-roles: [ADMIN, ATENDENTE]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteRequest' }
      responses:
        '201':
          description: Cliente criado
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clientes/pesquisa:
    post:
      tags: [Cadastro — Clientes]
      summary: Localiza cliente por CPF/CNPJ
      description: |
        Operação de **consulta** (não altera estado). Usa POST para que o documento trafegue no corpo,
        e não em URL/logs. Retorna `404` se não houver cliente.
      operationId: pesquisarClientePorDocumento
      x-use-case: BuscarClientePorDocumentoUseCase
      x-roles: [ADMIN, ATENDENTE]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PesquisaClienteRequest' }
      responses:
        '200':
          description: Cliente encontrado
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clientes/{clienteId}:
    parameters:
      - $ref: '#/components/parameters/ClienteId'
      - $ref: '#/components/parameters/XRequestId'
    get:
      tags: [Cadastro — Clientes]
      summary: Detalha cliente
      operationId: obterCliente
      x-use-case: ObterClienteUseCase
      x-roles: [ADMIN, ATENDENTE]
      responses:
        '200':
          description: Cliente
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Cadastro — Clientes]
      summary: Atualiza cliente
      description: O documento (CPF/CNPJ) é imutável após o cadastro.
      operationId: atualizarCliente
      x-use-case: AtualizarClienteUseCase
      x-roles: [ADMIN, ATENDENTE]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtualizarClienteRequest' }
      responses:
        '200':
          description: Cliente atualizado
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Cadastro — Clientes]
      summary: Remove cliente (anonimização LGPD)
      description: |
        Exclusão lógica com anonimização dos dados pessoais; o histórico de OS é preservado sem identificar
        o titular. Bloqueado (`409`, `CLIENTE_COM_OS_ABERTA`) se houver OS não entregue.
      operationId: removerCliente
      x-use-case: RemoverClienteUseCase
      x-roles: [ADMIN]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Removido
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clientes/{clienteId}/veiculos:
    get:
      tags: [Cadastro — Clientes]
      summary: Lista veículos do cliente
      operationId: listarVeiculosDoCliente
      x-use-case: ListarVeiculosDoClienteUseCase
      x-roles: [ADMIN, ATENDENTE]
      parameters:
        - $ref: '#/components/parameters/ClienteId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Veículos do cliente
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaVeiculos' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /clientes/{clienteId}/ordens-servico:
    get:
      tags: [Cadastro — Clientes]
      summary: Histórico de OS do cliente
      operationId: listarHistoricoOrdensDoCliente
      x-use-case: ListarOrdensServicoUseCase
      x-roles: [ADMIN, ATENDENTE]
      parameters:
        - $ref: '#/components/parameters/ClienteId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Histórico
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaOrdensServicoResumo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ═════════════════════════ VEÍCULOS ═════════════════════════
  /veiculos:
    get:
      tags: [Cadastro — Veículos]
      summary: Lista veículos
      operationId: listarVeiculos
      x-use-case: ListarVeiculosUseCase
      x-roles: [ADMIN, ATENDENTE, MECANICO]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: placa
          in: query
          description: Placa completa (a placa é identificação pública do veículo, não dado pessoal sensível)
          schema: { $ref: '#/components/schemas/Placa' }
        - name: clienteId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de veículos
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaVeiculos' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Cadastro — Veículos]
      summary: Cadastra veículo
      description: Placa validada (padrão antigo `ABC1234` ou Mercosul `ABC1D23`), normalizada em maiúsculas e única.
      operationId: cadastrarVeiculo
      x-use-case: CadastrarVeiculoUseCase
      x-roles: [ADMIN, ATENDENTE]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VeiculoRequest' }
      responses:
        '201':
          description: Veículo criado
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VeiculoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /veiculos/{veiculoId}:
    parameters:
      - $ref: '#/components/parameters/VeiculoId'
      - $ref: '#/components/parameters/XRequestId'
    get:
      tags: [Cadastro — Veículos]
      summary: Detalha veículo
      operationId: obterVeiculo
      x-use-case: ObterVeiculoUseCase
      x-roles: [ADMIN, ATENDENTE, MECANICO]
      responses:
        '200':
          description: Veículo
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
