  # ═════════════════════════ PORTAL DO CLIENTE ═════════════════════════
  /portal/autenticacao:
    post:
      tags: [Portal do Cliente]
      summary: Solicita código de acesso (OTP)
      description: |
        O cliente informa o **código de acompanhamento** (recebido na abertura da OS) e o CPF/CNPJ.
        Se o par for válido, um OTP de 6 dígitos (válido por 5 min) é enviado ao e-mail/telefone cadastrado.

        **Anti-enumeração:** a resposta é **sempre `202`** com o mesmo corpo, exista ou não a OS.
        Limite: 3 solicitações por OS a cada 15 min e rate limit por IP.
      operationId: solicitarCodigoAcesso
      x-use-case: SolicitarAcessoClienteUseCase
      security: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitarAcessoRequest' }
      responses:
        '202':
          description: Solicitação aceita (resposta idêntica em qualquer caso)
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesafioAcessoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /portal/autenticacao/{desafioId}/verificacao:
    post:
      tags: [Portal do Cliente]
      summary: Valida o OTP e emite token do cliente
      description: |
        Emite um JWT de **escopo restrito** (`scope=portal:os`, `sub` = id da OS, 30 min).
        O token só dá acesso à OS a que está vinculado. Após 5 tentativas erradas o desafio é invalidado.
      operationId: verificarCodigoAcesso
      x-use-case: VerificarAcessoClienteUseCase
      security: []
      parameters:
        - name: desafioId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificarAcessoRequest' }
      responses:
        '200':
          description: Token do cliente
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenClienteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /portal/ordem-servico:
    get:
      tags: [Portal do Cliente]
      summary: Cliente acompanha a OS
      description: |
        A OS é resolvida **pelo token** (sem ID na URL — elimina BOLA). Dados pessoais mascarados;
        custos internos e usuários da oficina não são expostos.
      operationId: acompanharOrdemServico
      x-use-case: AcompanharOrdemServicoUseCase
      security:
        - clienteBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Progresso da OS
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
          content:
            application/json:
