  # ═════════════════════════ ORDENS DE SERVIÇO ═════════════════════════
  /ordens-servico:
    get:
      tags: [Atendimento — Ordens de Serviço]
      summary: Lista ordens de serviço
      description: |
        Ordenação padrão por **prioridade de atendimento**: `EM_EXECUCAO` > `AGUARDANDO_APROVACAO` >
        `EM_DIAGNOSTICO` > `RECEBIDA`; dentro do mesmo status, da mais antiga para a mais nova.
        `FINALIZADA` e `ENTREGUE` só aparecem se filtradas explicitamente.
      operationId: listarOrdensServico
      x-use-case: ListarOrdensServicoUseCase
      x-roles: [ADMIN, ATENDENTE, MECANICO]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 6
            uniqueItems: true
            items: { $ref: '#/components/schemas/StatusOS' }
        - name: clienteId
          in: query
          schema: { type: string, format: uuid }
        - name: placa
          in: query
          schema: { $ref: '#/components/schemas/Placa' }
        - name: abertaDe
          in: query
          schema: { type: string, format: date }
        - name: abertaAte
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Página de OS
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaOrdensServicoResumo' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Atendimento — Ordens de Serviço]
      summary: Abre ordem de serviço
      description: |
        1. Identifica o cliente pelo **CPF/CNPJ** (cadastra se `novoCliente` for informado e o documento não existir).
        2. Identifica o veículo por `veiculoId` **ou** cadastra `novoVeiculo` vinculado ao cliente.
        3. Inclui serviços e, opcionalmente, peças/insumos (reservados no estoque de forma atômica).
        4. Gera o **orçamento automaticamente** (preços congelados no momento da inclusão).

        Status inicial `RECEBIDA`. Um e-mail é enviado ao cliente com o **código de acompanhamento**.
        Toda a operação ocorre em uma única transação. `Idempotency-Key` evita OS duplicadas em reenvios.
      operationId: abrirOrdemServico
      x-use-case: AbrirOrdemServicoUseCase
      x-roles: [ADMIN, ATENDENTE]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AbrirOrdemServicoRequest' }
            example:
              documentoCliente: '52998224725'
              novoCliente:
                nome: João da Silva
                email: joao@email.com
                telefone: '+5511999998888'
              novoVeiculo:
                placa: ABC1D23
                marca: Volkswagen
                modelo: Gol 1.6
                ano: 2019
              servicos:
                - { servicoId: 3fa85f64-5717-4562-b3fc-2c963f66afa6, quantidade: 1 }
              pecas:
                - { pecaId: 7c9e6679-7425-40de-944b-e07fc1f90ae7, quantidade: 4 }
              relatoCliente: Barulho na suspensão dianteira
      responses:
        '201':
          description: OS aberta
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdemServicoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ordens-servico/{osId}:
    get:
      tags: [Atendimento — Ordens de Serviço]
      summary: Detalha ordem de serviço
      operationId: obterOrdemServico
      x-use-case: ObterOrdemServicoUseCase
      x-roles: [ADMIN, ATENDENTE, MECANICO]
      parameters:
        - $ref: '#/components/parameters/OsId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: OS
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdemServicoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ordens-servico/{osId}/servicos:
    post:
      tags: [Atendimento — Ordens de Serviço]
      summary: Inclui serviço na OS
      description: |
        Permitido em `RECEBIDA` e `EM_DIAGNOSTICO` (orçamento recalculado).
        Em `EM_EXECUCAO` gera **orçamento adicional** e a OS volta para `AGUARDANDO_APROVACAO`.
      operationId: incluirServicoNaOrdem
      x-use-case: IncluirServicoNaOrdemUseCase
      x-roles: [ADMIN, ATENDENTE, MECANICO]
      parameters:
        - $ref: '#/components/parameters/OsId'
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemServicoRequest' }
      responses:
        '201':
          description: Serviço incluído
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdemServicoResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }

